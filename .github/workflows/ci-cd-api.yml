name: FinanceiroApi – API CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION: "FinanceiroApi.slnx"

jobs:
  # ─────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────
  api-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro123
          POSTGRES_DB: financeirodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Run unit tests – Domain
        run: |
          dotnet test tests/FinanceiroApi.Domain.Tests/FinanceiroApi.Domain.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=domain-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Run unit tests – Application
        run: |
          dotnet test tests/FinanceiroApi.Application.Tests/FinanceiroApi.Application.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=application-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=financeirodb_test;Username=financeiro;Password=financeiro123"
          Redis__ConnectionString: "localhost:6379"
        run: |
          dotnet test tests/FinanceiroApi.Integration.Tests/FinanceiroApi.Integration.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=integration-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Run E2E tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=financeirodb_test;Username=financeiro;Password=financeiro123"
          Redis__ConnectionString: "localhost:6379"
        run: |
          dotnet test tests/FinanceiroApi.E2E.Tests/FinanceiroApi.E2E.Tests.csproj \
            --no-build -c Release \
            --logger "trx;LogFileName=e2e-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-test-results
          path: TestResults/

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges"

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: CoverageReport/

  # ─────────────────────────────────────────
  # 2. CODE QUALITY
  # ─────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [api-ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format

      - name: Check formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --severity warn

  # ─────────────────────────────────────────
  # 3. DOCKER BUILD & PUSH – desabilitado
  # (deploy gerenciado pelo Render via GitHub)
  # ─────────────────────────────────────────
  docker-build:
    name: Docker – Build & Push
    runs-on: ubuntu-latest
    needs: [api-ci, code-quality]
    if: false

    steps:
      - name: Skipped
        run: echo "Deploy is handled by Render"

  # ─────────────────────────────────────────
  # 4. DEPLOY – desabilitado
  # (deploy gerenciado pelo Render via GitHub)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy – Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: false

    steps:
      - name: Skipped
        run: echo "Deploy is handled by Render"