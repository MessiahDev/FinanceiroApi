name: financeiroapi

services:

  postgres:
    image: postgres:16-alpine
    container_name: financeiroapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiro123}
      POSTGRES_DB: ${POSTGRES_DB:-financeirodb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financeiro} -d ${POSTGRES_DB:-financeirodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeiroapi-net

  redis:
    image: redis:7-alpine
    container_name: financeiroapi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeiroapi-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: financeiroapi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeiroapi-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeiroapi-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: >
        Host=postgres;Port=5432;
        Database=${POSTGRES_DB:-financeirodb};
        Username=${POSTGRES_USER:-financeiro};
        Password=${POSTGRES_PASSWORD:-financeiro123}
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis123}"
      Jwt__SecretKey: ${JWT_SECRET:-sua_chave_secreta_minimo_32_caracteres_aqui}
      Jwt__Issuer: ${JWT_ISSUER:-FinanceiroApi}
      Jwt__Audience: ${JWT_AUDIENCE:-FinanceiroApiClients}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES:-60}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-guest}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMQ__VirtualHost: ${RABBITMQ_VHOST:-/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - financeiroapi-net

  frontend:
    build:
      context: ../financeiro-web
      dockerfile: Dockerfile.financeiro-web
      args:
        VITE_API_URL: http://localhost:8080
    container_name: financeiroapi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - financeiroapi-net

  adminer:
    image: adminer:latest
    container_name: financeiroapi-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - financeiroapi-net
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  financeiroapi-net:
    driver: bridge
